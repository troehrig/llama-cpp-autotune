name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: >-
          python -m py_compile llama_autotune.py run_autotune.py
          analyze_autotune.py tests/test_gguf_metadata.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
